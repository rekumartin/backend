<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Študentský Denník | Full-Stack App</title>
    <style>
        :root {
            --primary: #00d4ff;
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text: #ffffff;
            --text-dim: #bbb;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
        }

        p.subtitle {
            color: var(--text-dim);
            margin-bottom: 40px;
        }

        /* Mriežka kariet */
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 1200px;
        }

        /* Štýl karty */
        .card {
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid #333;
            position: relative;
        }

        .card:hover {
            transform: translateY(-12px) scale(1.02);
            border-color: var(--primary);
            box-shadow: 0 20px 40px rgba(0, 212, 255, 0.2);
        }

        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            filter: grayscale(20%);
            transition: 0.3s;
        }

        .card:hover img {
            filter: grayscale(0%);
        }

        .info {
            padding: 25px;
        }

        .nickname {
            display: inline-block;
            background: rgba(0, 212, 255, 0.1);
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 12px;
            border: 1px solid var(--primary);
        }

        .name {
            font-size: 1.5rem;
            margin: 0 0 10px 0;
            font-weight: 700;
        }

        .bio {
            font-size: 0.95rem;
            color: var(--text-dim);
            line-height: 1.6;
            margin: 0;
        }

        /* Stavové správy */
        #status-msg {
            font-size: 1.1rem;
            margin-top: 50px;
            color: var(--primary);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        .error {
            color: #ff4d4d !important;
            animation: none !important;
            text-align: center;
            max-width: 400px;
        }
    </style>
</head>
<body>

    <h1>Študentský Denník</h1>
    <p class="subtitle">Dáta načítané z tvojho API</p>
    
    <div id="status-msg">Pripájanie k serveru...</div>
    <div class="container" id="student-container"></div>

    <script>
        /**
         * DÔLEŽITÉ: window.location.origin zabezpečí, že frontend 
         * bude hľadať backend na rovnakej adrese, kde beží on sám.
         */
        const API_URL = window.location.origin + '/students';

        async function fetchStudents() {
            const container = document.getElementById('student-container');
            const statusMsg = document.getElementById('status-msg');

            try {
                const response = await fetch(API_URL);
                
                if (!response.ok) throw new Error('Nepodarilo sa získať dáta');

                const students = await response.json();
                
                // Odstránime loading správu
                statusMsg.style.display = 'none';

                // Ak nemáme žiadnych študentov
                if (students.length === 0) {
                    statusMsg.style.display = 'block';
                    statusMsg.innerHTML = 'Databáza je prázdna.';
                    return;
                }

                // Generovanie kariet
                container.innerHTML = students.map(student => `
                    <div class="card">
                        <img src="${student.image}" alt="${student.name}" 
                             onerror="this.src='https://via.placeholder.com/400x300?text=Chýba+fotka'">
                        <div class="info">
                            <span class="nickname">${student.nickname || 'Bez prezývky'}</span>
                            <h2 class="name">${student.name} ${student.surname}</h2>
                            <p class="bio">${student.bio || 'Tento študent nemá žiadne info.'}</p>
                        </div>
                    </div>
                `).join('');

            } catch (error) {
                console.error('Chyba:', error);
                statusMsg.classList.add('error');
                statusMsg.innerHTML = `
                    ❌ <b>Chyba pripojenia!</b><br>
                    Uisti sa, že tvoj backend beží (node server.js) 
                    alebo skontroluj URL na Renderi.
                `;
            }
        }

        // Spustiť po načítaní stránky
        window.addEventListener('DOMContentLoaded', fetchStudents);
    </script>
</body>
</html>
