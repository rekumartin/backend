<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Študentský Denník</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a1a; color: white; padding: 40px; }
        h1 { text-align: center; color: #ffcc00; }
        .container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; max-width: 1200px; margin: auto; }
        .card { background: #2a2a2a; border: 1px solid #444; border-radius: 12px; overflow: hidden; transition: transform 0.3s; }
        .card:hover { transform: translateY(-10px); border-color: #ffcc00; }
        .card img { width: 100%; height: 200px; object-fit: cover; }
        .info { padding: 15px; }
        .nickname { font-weight: bold; color: #ffcc00; font-size: 0.9em; text-transform: uppercase; }
        .bio { font-size: 0.85em; color: #ccc; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>Moji Študenti</h1>
    <div class="container" id="student-list"></div>

    <script>
        // Use your Render URL here after you deploy!
        const API_URL = 'http://localhost:3000/students';

        async function loadStudents() {
            try {
                const response = await fetch(API_URL);
                const students = await response.json();
                const list = document.getElementById('student-list');

                students.forEach(s => {
                    list.innerHTML += `
                        <div class="card">
                            <img src="${s.image}" alt="${s.name}">
                            <div class="info">
                                <h3>${s.name} ${s.surname}</h3>
                                <div class="nickname">${s.nickname}</div>
                                <p class="bio">${s.bio}</p>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                console.error("Chyba pri načítaní:", err);
            }
        }
        loadStudents();
    </script>
</body>
</html>
