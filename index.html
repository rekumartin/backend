<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Študentský Denník | Filter & Sort</title>
    <style>
        :root {
            --primary: #00d4ff;
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text: #ffffff;
            --text-dim: #bbb;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { color: var(--primary); text-transform: uppercase; letter-spacing: 3px; margin-bottom: 5px; }
        
        /* Štýl pre vyhľadávacie pole */
        .search-container {
            margin-bottom: 30px;
            width: 100%;
            max-width: 400px;
        }

        #search-input {
            width: 100%;
            padding: 12px 20px;
            border-radius: 25px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        #search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 1200px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            border: 1px solid #333;
            transition: 0.3s;
        }

        .card img { width: 100%; height: 220px; object-fit: cover; }
        .info { padding: 20px; }
        .nickname { color: var(--primary); font-weight: bold; font-size: 0.8rem; margin-bottom: 5px; display: block; }
        .name { font-size: 1.4rem; margin: 0 0 10px 0; }
        .bio { font-size: 0.9rem; color: var(--text-dim); }

        #status-msg { font-size: 1.1rem; margin: 20px; color: var(--primary); }
    </style>
</head>
<body>

    <h1>Študentský Denník</h1>
    
    <div class="search-container">
        <input type="text" id="search-input" placeholder="Hľadať študenta podľa mena...">
    </div>
    
    <div id="status-msg">Načítavam dáta...</div>
    <div class="container" id="student-container"></div>

    <script>
        const API_URL = window.location.origin + '/students';
        let allStudents = []; // Sem si uložíme všetkých študentov po načítaní

        // 1. MANUÁLNY SORTING (Bubble Sort)
        function zoradStudentov(pole) {
            let n = pole.length;
            for (let i = 0; i < n; i++) {
                for (let j = 0; j < n - 1 - i; j++) {
                    if (pole[j].name.toLowerCase() > pole[j+1].name.toLowerCase()) {
                        let temp = pole[j];
                        pole[j] = pole[j + 1];
                        pole[j + 1] = temp;
                    }
                }
            }
            return pole;
        }

        // 2. FUNKCIA NA VYKRESLENIE KARIET
        function zobrazStudentov(zoznam) {
            const container = document.getElementById('student-container');
            if (zoznam.length === 0) {
                container.innerHTML = "<p style='grid-column: 1/-1; text-align: center;'>Nenašli sa žiadni študenti.</p>";
                return;
            }
            container.innerHTML = zoznam.map(student => `
                <div class="card">
                    <img src="${student.image}" alt="${student.name}" onerror="this.src='https://via.placeholder.com/400x300'">
                    <div class="info">
                        <span class="nickname">${student.nickname}</span>
                        <h2 class="name">${student.name} ${student.surname}</h2>
                        <p class="bio">${student.bio}</p>
                    </div>
                </div>
            `).join('');
        }

        // 3. LOGIKA FILTROVANIA
        document.getElementById('search-input').addEventListener('input', (e) => {
            const hladanyText = e.target.value.toLowerCase();
            
            // Vyfiltrujeme študentov, ktorých meno alebo priezvisko obsahuje napísaný text
            const vyfiltrovani = allStudents.filter(s => 
                s.name.toLowerCase().includes(hladanyText) || 
                s.surname.toLowerCase().includes(hladanyText)
            );
            
            zobrazStudentov(vyfiltrovani);
        });

        // 4. NAČÍTANIE DÁT
        async function fetchStudents() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                // Zoradíme ich hneď na začiatku
                allStudents = zoradStudentov(data);
                
                document.getElementById('status-msg').style.display = 'none';
                zobrazStudentov(allStudents);
            } catch (error) {
                document.getElementById('status-msg').innerHTML = "❌ Chyba pripojenia.";
            }
        }

        fetchStudents();
    </script>
</body>
</html>
