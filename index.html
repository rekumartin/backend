<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoznam Študentov</title>
    <style>
        /* Moderný tmavý dizajn */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #00d4ff;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Mriežka pre karty */
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1200px;
        }

        /* Štýl karty študenta */
        .card {
            background: #1e1e1e;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            transition: transform 0.3s ease, border 0.3s ease;
            border: 1px solid #333;
        }

        .card:hover {
            transform: translateY(-10px);
            border-color: #00d4ff;
        }

        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-bottom: 2px solid #00d4ff;
        }

        .info {
            padding: 20px;
        }

        .name {
            font-size: 1.4rem;
            margin: 0;
            color: #fff;
        }

        .nickname {
            color: #00d4ff;
            font-weight: bold;
            font-style: italic;
            margin-bottom: 10px;
            display: block;
        }

        .bio {
            font-size: 0.9rem;
            color: #bbb;
            line-height: 1.4;
        }

        /* Loading indikátor */
        #loader {
            font-size: 1.2rem;
            color: #00d4ff;
        }
    </style>
</head>
<body>

    <h1>Študentský Denník</h1>
    
    <div id="loader">Načítavam študentov z databázy...</div>
    <div class="container" id="student-container"></div>

    <script>
        // Táto adresa musí sedieť s tvojím backendom
        const API_URL = 'http://localhost:3000/students';

        async function fetchStudents() {
            try {
                const response = await fetch(API_URL);
                const students = await response.json();
                
                const container = document.getElementById('student-container');
                const loader = document.getElementById('loader');
                
                // Schováme loader
                loader.style.display = 'none';

                // Vymažeme obsah (ak by tam niečo bolo)
                container.innerHTML = '';

                // Vygenerujeme karty
                students.forEach(student => {
                    const card = `
                        <div class="card">
                            <img src="${student.image}" alt="${student.name}" onerror="this.src='https://via.placeholder.com/300x250?text=Bez+fotky'">
                            <div class="info">
                                <span class="nickname">"${student.nickname}"</span>
                                <h2 class="name">${student.name} ${student.surname}</h2>
                                <p class="bio">${student.bio}</p>
                            </div>
                        </div>
                    `;
                    container.innerHTML += card;
                });

            } catch (error) {
                console.error('Chyba pri načítaní dát:', error);
                document.getElementById('loader').innerHTML = '❌ Nepodarilo sa pripojiť k backendu. Beží ti node server.js?';
            }
        }

        // Spustíme načítanie pri otvorení stránky
        fetchStudents();
    </script>
</body>
</html>
