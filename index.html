<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Študentský Denník | Sorting Edition</title>
    <style>
        :root {
            --primary: #00d4ff;
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text: #ffffff;
            --text-dim: #bbb;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { color: var(--primary); text-transform: uppercase; letter-spacing: 3px; }
        p.subtitle { color: var(--text-dim); margin-bottom: 40px; }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 1200px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            border: 1px solid #333;
            transition: 0.3s;
        }

        .card:hover { transform: translateY(-10px); border-color: var(--primary); }
        .card img { width: 100%; height: 220px; object-fit: cover; }
        .info { padding: 20px; }
        .nickname { color: var(--primary); font-weight: bold; font-size: 0.8rem; margin-bottom: 5px; display: block; }
        .name { font-size: 1.4rem; margin: 0 0 10px 0; }
        .bio { font-size: 0.9rem; color: var(--text-dim); line-height: 1.5; }

        #status-msg { font-size: 1.1rem; margin: 20px; color: var(--primary); }
    </style>
</head>
<body>

    <h1>Študentský Denník</h1>
    <p class="subtitle">Zoznam zoradený podľa abecedy (A-Z)</p>
    
    <div id="status-msg">Načítavam a triedim študentov...</div>
    <div class="container" id="student-container"></div>

    <script>
        const API_URL = window.location.origin + '/students';

        // --- MANUÁLNY SORTING ALGORITMUS (Bubble Sort) ---
        function zoradStudentov(pole) {
            let n = pole.length;
            
            // Prechádzame celým polom
            for (let i = 0; i < n; i++) {
                // Porovnávame susedné dvojice
                for (let j = 0; j < n - 1 - i; j++) {
                    
                    // Získame mená a dáme ich na malé písmená pre správne porovnanie
                    let menoA = pole[j].name.toLowerCase();
                    let menoB = pole[j+1].name.toLowerCase();

                    // Ak je meno vľavo "väčšie" ako meno vpravo (v abecede ďalej)
                    if (menoA > menoB) {
                        // VYMENÍME ICH (SWAP)
                        let docasnaPremenna = pole[j];
                        pole[j] = pole[j + 1];
                        pole[j + 1] = docasnaPremenna;
                    }
                }
            }
            return pole;
        }

        async function fetchStudents() {
            const container = document.getElementById('student-container');
            const statusMsg = document.getElementById('status-msg');

            try {
                const response = await fetch(API_URL);
                let students = await response.json();
                
                // 1. ZORADÍME DÁTA (RUČNE)
                students = zoradStudentov(students);

                // 2. SCHOVÁME STATUS
                statusMsg.style.display = 'none';

                // 3. VYKRESLÍME KARTY
                container.innerHTML = students.map(student => `
                    <div class="card">
                        <img src="${student.image}" alt="${student.name}" onerror="this.src='https://via.placeholder.com/400x300'">
                        <div class="info">
                            <span class="nickname">${student.nickname}</span>
                            <h2 class="name">${student.name} ${student.surname}</h2>
                            <p class="bio">${student.bio}</p>
                        </div>
                    </div>
                `).join('');

            } catch (error) {
                console.error('Chyba:', error);
                statusMsg.innerHTML = "❌ Nepodarilo sa načítať dáta.";
            }
        }

        window.addEventListener('DOMContentLoaded', fetchStudents);
    </script>
</body>
</html>
